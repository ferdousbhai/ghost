[package]
name = "ghost-window"
# Never published as a crate: the release version is the workspace package.json's, which `--version` reports.
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Ghost's window: the owner's own data and the ghost, in one GTK 4 app"
repository = "https://github.com/ferdousbhai/ghost"
publish = false

[[bin]]
name = "ghost-window"
path = "src/main.rs"

[dependencies]
# The look and the shared widgets, pinned by commit (v0.5.7).
omui = { git = "https://github.com/ferdousbhai/omui", rev = "d5796183fdcc1dab218c7af5343bc0f29389db0e" }
# The GTK 4 stack omui is built on; cargo resolves both to one gtk4.
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_14"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1.0"
async-channel = "2.3"
urlencoding = "2.1"
# Plain HTTP to ghostd on 127.0.0.1: no TLS stack.
ureq = { version = "2.12", default-features = false, features = ["json"] }

[features]
# Scripted QA (dev/qa.sh): omui's `OMUI_QA=1` mode. Off in a release build, which carries none of it.
qa = ["omui/qa"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
