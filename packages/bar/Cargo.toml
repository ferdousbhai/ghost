[package]
name = "ghost-bar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ghost's bar: the conversation with the ghost as a prompt and captions at the bottom of the screen"
publish = false

[[bin]]
name = "ghost-bar"
path = "src/main.rs"

[dependencies]
# The look and the shared widgets, pinned by commit (v0.5.7).
omui = { git = "https://github.com/ferdousbhai/omui", rev = "d5796183fdcc1dab218c7af5343bc0f29389db0e" }
# The GTK 4 stack omui is built on; cargo resolves both to one gtk4.
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_14"] }
# The bar's place on the screen edge; the system library is one Omarchy's own dictation app already needs.
gtk4-layer-shell = "0.9"
serde_json = "1.0"
async-channel = "2.3"
urlencoding = "2.1"
# Plain HTTP to ghostd on 127.0.0.1: no TLS stack.
ureq = { version = "2.12", default-features = false, features = ["json"] }

[features]
# Scripted QA (dev/qa.sh): omui's `OMUI_QA=1` mode. Off in a release build, which carries none of it.
qa = ["omui/qa"]
