[package]
name = "ghostd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ghost's daemon and its `ghost` command line"
publish = false

[lib]
name = "ghostd"
path = "src/lib.rs"

[[bin]]
name = "ghostd"
path = "src/bin/ghostd.rs"

[[bin]]
name = "ghost"
path = "src/bin/ghost.rs"

[dependencies]
# Key order is kept, so hooks.json is written back as the owner wrote it.
serde_json = { version = "1.0", features = ["preserve_order"] }
# Process groups, signals, local time.
libc = "0.2"
regex = "1"
# Request-line and header parsing for the loopback server and client.
httparse = "1.10"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "arithmetic"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
