# Ghost — Hyprland keybind, for a config that is still .conf rather than Lua.
#
# Install:
#   mkdir -p ~/.config/hypr/ghost
#   cp ghost.conf ~/.config/hypr/ghost/ghost.conf
# then add to ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/ghost/ghost.conf
#
# On Omarchy 4 the Hyprland config is Lua; `source =` of a .conf still works,
# or use contrib/hyprland/ghost.lua instead.

# Ghost's HUD is an omarchy-shell plugin, so this is an IPC call into the shell
# that is already running: raise when shut or unfocused, hide when focused.
bind = SUPER CTRL, G, exec, omarchy-shell shell toggle ferdousbhai.ghost

# A window rule matches by title: a plugin's window carries the host shell's
# app-id, and only a root shell.qml may set one.
# windowrule = float, title:^Ghost( — .*)?$
