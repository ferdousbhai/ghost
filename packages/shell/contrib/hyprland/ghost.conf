# Ghost shell — Hyprland keybinds and layer rules.
#
# Install:
#   mkdir -p ~/.config/hypr/ghost
#   cp ghost.conf ~/.config/hypr/ghost/ghost.conf
# then add to ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/ghost/ghost.conf
#
# On Omarchy 4 the Hyprland config is Lua; `source =` of a .conf still works,
# or port these lines to Lua (see contrib/hyprland/ghost.lua).

# ---- Summon (launch-or-focus) -----------------------------------------------
# `ghost-launch` starts the shell installed at ~/.config/quickshell/ghost/ when
# needed, then calls its IPC handler.
#
# The chat HUD is now a normal toplevel window (app-id `ghost`), so
# SUPER+CTRL+G is
# launch-or-focus: it reveals and focuses the window, pulling it to the front if
# it is already open elsewhere, and hides it only when it is already focused.
bind = SUPER CTRL, G, exec, ghost-launch toggle

# Summon a named ghost directly.
# bind = SUPER SHIFT, G, exec, qs -c ghost ipc call ghost summon casper

# ---- Moving the window ------------------------------------------------------
# Nothing to add. Because the HUD is a real toplevel window, Hyprland's own
# binds act on it like any app: SHIFT+SUPER+<n> sends it to a workspace,
# SUPER+<n> follows it there, and it tiles/resizes in the normal layout. The
# old `moveNext` IPC workaround (needed only while the HUD was a layer surface)
# is gone.

# ---- Window rules (optional) ------------------------------------------------
# The HUD tiles by default. If you would rather it float at a fixed size, or
# want it centred, target its app-id. Examples — uncomment to taste:
# windowrule = float, class:^(ghost)$
# windowrule = size 880 620, class:^(ghost)$
# windowrule = center, class:^(ghost)$

# ---- Layer rules ------------------------------------------------------------
# Only the opt-in bar strip (GHOST_BAR_SURFACE=1) is still a layer surface; the
# HUD is a normal window and takes no layer rule. Skip the bar's fade-in.
layerrule = noanim, ghost-bar
