# Ghost shell — Hyprland keybinds and layer rules.
#
# Install:
#   mkdir -p ~/.config/hypr/ghost
#   cp ghost.conf ~/.config/hypr/ghost/ghost.conf
# then add to ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/ghost/ghost.conf
#
# On Omarchy 4 the Hyprland config is Lua; `source =` of a .conf still works,
# or port these three lines to Lua (see contrib/README.md).

# ---- Summon -----------------------------------------------------------------
# `qs -c ghost` selects the shell installed at ~/.config/quickshell/ghost/.
# From a checkout instead: qs -p /path/to/packages/shell/qml/shell.qml ...
bind = SUPER, G, exec, qs -c ghost ipc call ghost toggle

# Summon a named ghost directly.
# bind = SUPER SHIFT, G, exec, qs -c ghost ipc call ghost summon casper

# ---- Layer rules ------------------------------------------------------------
# The HUD animates itself; let the compositor leave it alone so summoning is
# instant rather than sliding in from an edge.
layerrule = noanim, ghost-hud
layerrule = noanim, ghost-bar

# Optional: blur behind the HUD. Off by default — the HUD paints an opaque
# card, so blur costs GPU time for something nobody sees.
# layerrule = blur, ghost-hud
