# Ghost — Hyprland keybind and window rule, for a config that is still .conf
# rather than Lua. A Lua config needs neither: the shell sets both at runtime
# through `hyprctl eval`, which a .conf config does not run.
#
# Install:
#   mkdir -p ~/.config/hypr/ghost
#   cp ghost.conf ~/.config/hypr/ghost/ghost.conf
# then add to ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/ghost/ghost.conf
#
# On a Lua config (Omarchy 4) use ghost.lua instead, and only to add a key.

# Ghost is an omarchy-shell plugin, so this is an IPC call into the shell that
# is already running: light the screen edges and open a listening prompt;
# pressed again, close it.
bind = SUPER CTRL, G, exec, omarchy-shell shell toggle ferdousbhai.ghost
# History and settings (the bar's ghost mark opens them too):
# bind = SUPER CTRL SHIFT, G, exec, omarchy-shell ghost section home

# The prompt and the history are windows that cover their monitor: floating,
# pinned, undecorated, and fully opaque (they draw their own scrim). The same
# rule the shell asks for at runtime on a Lua config.
windowrule = match:class ^org\.quickshell$, match:title ^(Ghost|Ghost prompt)$, float on, pin on, size monitor_w monitor_h, move 0 0, border_size 0, rounding 0, no_shadow on, no_anim on, opacity 1 1, tag -default-opacity
