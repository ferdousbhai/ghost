[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ghost-desktop-helper"
version = "0.1.0"
description = "The ghost's Omarchy (Hyprland/Wayland) computer-use Python sidecar: a line-oriented JSON bridge over a vendored subset of omarchy-quattro-harness."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
  "ghost",
  "omarchy",
  "hyprland",
  "wayland",
  "at-spi",
  "accessibility",
  "computer-use",
]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
# Pillow crops the full headless-output image back to the requested window, so
# it is part of the advertised three-rung capture ladder rather than an extra.
# The remaining capability tools are system packages (grim, wtype, ydotool,
# hyprctl), and AT-SPI rides the system PyGObject stack. See the README for the
# Arch/Omarchy package names.
dependencies = ["pillow>=10"]

[project.optional-dependencies]
# AT-SPI needs the system GObject introspection stack. On Omarchy the supported
# route is the system package (`sudo pacman -S python-gobject at-spi2-core`);
# this extra exists only for virtualenvs that build PyGObject themselves.
atspi = ["PyGObject>=3.50; sys_platform == 'linux'"]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.uv]
# The pure-Python code runs on 3.11+, but AT-SPI does not: PyGObject ships no
# wheels, so the bindings are whatever the distro compiled, for exactly one
# minor version (`/usr/lib/python3.14/site-packages/gi` on Omarchy today). A
# uv-*managed* interpreter would therefore be a silently a11y-less helper, so
# the environment is built on the system Python that owns those bindings; the
# version itself is pinned in `.python-version`.
python-preference = "only-system"

[project.scripts]
ghost-desktop-helper = "ghost_desktop_helper.protocol:main"

[tool.hatch.build.targets.wheel]
# The harness is deliberately nested inside this one distribution's private
# namespace; installing the upstream top-level `omaharness` alongside Ghost is
# therefore safe in either order.
packages = ["src/ghost_desktop_helper"]

[tool.hatch.build.targets.wheel.force-include]
"src/ghost_desktop_helper/_vendor/omaharness/LICENSE" = "ghost_desktop_helper/_vendor/omaharness/LICENSE"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: needs a real Hyprland session; skipped unless GHOST_DESKTOP_LIVE=1",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/ghost_desktop_helper/_vendor"]

[tool.ruff.lint]
# Keep the first-party bridge and its tests on modern Python, import, bugbear,
# exception-safety, annotation-marker, and builtin-shadowing rules. The
# attributed upstream vendor remains byte-for-byte apart from its path header.
select = ["A", "ANN", "B", "BLE", "E4", "E7", "E9", "F", "I", "UP"]
# JSON values and injected desktop backends are intentionally dynamic. Strict
# mypy still checks every explicit Any boundary and all first-party signatures.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Test doubles intentionally accept heterogeneous protocol values; production
# code remains fully annotated and is also checked by strict mypy below.
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/ghost_desktop_helper"]
exclude = ["src/ghost_desktop_helper/_vendor"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The private vendor is checked by its upstream project; Ghost type-checks the
# bridge against its public runtime surface without rewriting third-party code.
module = ["ghost_desktop_helper._vendor.omaharness.*"]
ignore_errors = true
