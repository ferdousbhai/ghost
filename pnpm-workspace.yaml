packages:
  - packages/*

# pnpm's shared-lockfile deploy is the only deploy path that remains fully
# frozen and offline. Keep injected workspace copies synchronized after each
# build so development and release installs cannot package stale output.
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

patchedDependencies:
  '@earendil-works/pi-coding-agent@0.86.0': patches/@earendil-works__pi-coding-agent@0.86.0.patch
