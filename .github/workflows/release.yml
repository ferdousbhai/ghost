name: Release candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify, stage a draft, or publish one already-staged draft
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - stage
          - publish
      source_run_id:
        description: Successful Arch package workflow run ID on master
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit from that run
        required: true
        type: string
      version:
        description: Exact three-part candidate version
        required: true
        type: string
      destination_repository:
        description: Optional owner/repo confirmation of repository-level GHOST_RELEASE_REPOSITORY
        required: false
        type: string
        default: ''
      draft_release_id:
        description: Required only when publishing the previously staged draft
        required: false
        type: string
        default: ''
      candidate_commit:
        description: Required only when publishing; exact staged commit the owner accepted
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: ghost-public-release
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify exact private candidate
    if: >-
      github.ref == 'refs/heads/master' &&
      github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/master', github.repository) &&
      github.workflow_sha == github.sha
    runs-on: ubuntu-latest
    outputs:
      destination: ${{ steps.expected-destination.outputs.destination }}
      run_attempt: ${{ steps.source-run.outputs.run_attempt }}
      trusted_sha: ${{ steps.trusted.outputs.trusted_sha }}
      workflow_ref: ${{ steps.source-run.outputs.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          path: orchestration
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Verify trusted protected-master orchestration
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          CHECKOUT_SHA="$(git -C orchestration rev-parse 'HEAD^{commit}')"
          gh api "repos/$SOURCE_REPOSITORY/branches/master" > trusted-branch.json
          gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/master" > trusted-ref.json
          python orchestration/.github/scripts/validate-release-workflow.py trusted-run \
            --repository "$SOURCE_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --dispatch-sha "$DISPATCH_SHA" \
            --checkout-sha "$CHECKOUT_SHA" \
            --branch-json trusted-branch.json \
            --ref-json trusted-ref.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate manual release inputs
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          DESTINATION_REPOSITORY: ${{ inputs.destination_repository }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          python orchestration/.github/scripts/validate-release-workflow.py inputs \
            --mode "$MODE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --destination "$DESTINATION_REPOSITORY" \
            --release-id "$DRAFT_RELEASE_ID" \
            --candidate-commit "$CANDIDATE_COMMIT"

      - name: Resolve repository-level destination
        id: expected-destination
        env:
          INPUT_REPOSITORY: ${{ inputs.destination_repository }}
          CONFIGURED_REPOSITORY: ${{ vars.GHOST_RELEASE_REPOSITORY }}
        run: |
          python orchestration/.github/scripts/validate-release-workflow.py destination \
            --input-repository "$INPUT_REPOSITORY" \
            --configured-repository "$CONFIGURED_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify successful source run identity
        id: source-run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          gh api "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python orchestration/.github/scripts/validate-release-workflow.py source-run \
            --run-json source-run.json \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Exercise release orchestration fixtures
        run: python orchestration/.github/scripts/test-release-draft.py

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghost-public-candidate-${{ inputs.source_sha }}-${{ steps.source-run.outputs.run_attempt }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded public candidate
        env:
          GHOST_RELEASE_REPOSITORY: ${{ steps.expected-destination.outputs.destination }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RUN_ATTEMPT: ${{ steps.source-run.outputs.run_attempt }}
          WORKFLOW_REF: ${{ steps.source-run.outputs.workflow_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git -C source rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          SOURCE_DATE_EPOCH="$(git -C source show -s --format=%ct "$SOURCE_SHA")"
          python orchestration/packaging/release/public-candidate.py verify \
            --candidate candidate \
            --version "$VERSION" \
            --source-tag "v$VERSION" \
            --source-commit "$SOURCE_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --workflow-repository "$SOURCE_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"
          python orchestration/.github/scripts/release-draft.py verify-local \
            --candidate candidate \
            --repository "$GHOST_RELEASE_REPOSITORY" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION"

      - name: Record dry-run result
        if: inputs.mode == 'dry-run'
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '### Candidate verified without publication credentials\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Version: `%s`\n- Source SHA: `%s`\n- Source run: `%s`\n' \
            "$VERSION" "$SOURCE_SHA" "$SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  publication:
    name: ${{ inputs.mode == 'stage' && 'Stage protected draft' || 'Publish protected draft' }}
    if: >-
      needs.candidate.result == 'success' &&
      (inputs.mode == 'stage' || inputs.mode == 'publish')
    needs: candidate
    runs-on: ubuntu-latest
    environment: public-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.trusted_sha }}
          fetch-depth: 1
          path: orchestration
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Resolve repository-level destination
        id: destination
        env:
          INPUT_REPOSITORY: ${{ inputs.destination_repository }}
          CONFIGURED_REPOSITORY: ${{ needs.candidate.outputs.destination }}
        run: |
          test "$(git -C orchestration rev-parse 'HEAD^{commit}')" = \
            "${{ needs.candidate.outputs.trusted_sha }}"
          python orchestration/.github/scripts/validate-release-workflow.py destination \
            --input-repository "$INPUT_REPOSITORY" \
            --configured-repository "$CONFIGURED_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghost-public-candidate-${{ inputs.source_sha }}-${{ needs.candidate.outputs.run_attempt }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Redownload and reverify candidate before minting
        env:
          GHOST_RELEASE_REPOSITORY: ${{ steps.destination.outputs.destination }}
          DESTINATION_REPOSITORY: ${{ steps.destination.outputs.destination }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RUN_ATTEMPT: ${{ needs.candidate.outputs.run_attempt }}
          WORKFLOW_REF: ${{ needs.candidate.outputs.workflow_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git -C source rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          SOURCE_DATE_EPOCH="$(git -C source show -s --format=%ct "$SOURCE_SHA")"
          python orchestration/packaging/release/public-candidate.py verify \
            --candidate candidate \
            --version "$VERSION" \
            --source-tag "v$VERSION" \
            --source-commit "$SOURCE_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --workflow-repository "$SOURCE_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"
          python orchestration/.github/scripts/release-draft.py verify-local \
            --candidate candidate \
            --repository "$DESTINATION_REPOSITORY" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION"

      - name: Reconfirm trusted protected master after environment admission
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TRUSTED_SHA: ${{ needs.candidate.outputs.trusted_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          CHECKOUT_SHA="$(git -C orchestration rev-parse 'HEAD^{commit}')"
          gh api "repos/$SOURCE_REPOSITORY/branches/master" > publication-branch.json
          gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/master" > publication-ref.json
          python orchestration/.github/scripts/validate-release-workflow.py trusted-run \
            --repository "$SOURCE_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$TRUSTED_SHA" \
            --dispatch-sha "$TRUSTED_SHA" \
            --checkout-sha "$CHECKOUT_SHA" \
            --branch-json publication-branch.json \
            --ref-json publication-ref.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Mint least-privilege publication token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GHOST_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GHOST_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.destination.outputs.owner }}
          repositories: ${{ steps.destination.outputs.repository }}
          permission-administration: read
          permission-contents: write

      - name: Preflight public repository and immutable releases
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DESTINATION_REPOSITORY: ${{ steps.destination.outputs.destination }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          python orchestration/.github/scripts/release-draft.py preflight \
            --candidate candidate \
            --repository "$DESTINATION_REPOSITORY" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION"

      - name: Create or resume draft without overwriting assets
        id: stage
        if: inputs.mode == 'stage'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DESTINATION_REPOSITORY: ${{ steps.destination.outputs.destination }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          python orchestration/.github/scripts/release-draft.py stage \
            --candidate candidate \
            --repository "$DESTINATION_REPOSITORY" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish exact staged draft and verify anonymous downloads
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DESTINATION_REPOSITORY: ${{ steps.destination.outputs.destination }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          ACCEPTED_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          python orchestration/.github/scripts/release-draft.py publish \
            --candidate candidate \
            --repository "$DESTINATION_REPOSITORY" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --release-id "$DRAFT_RELEASE_ID" \
            --accepted-candidate-commit "$ACCEPTED_CANDIDATE_COMMIT"

      - name: Record staged draft identity
        if: inputs.mode == 'stage'
        env:
          CANDIDATE_COMMIT: ${{ steps.stage.outputs.candidate_commit }}
          CANDIDATE_REF: ${{ steps.stage.outputs.candidate_ref }}
          RELEASE_ID: ${{ steps.stage.outputs.release_id }}
          RELEASE_URL: ${{ steps.stage.outputs.release_url }}
        run: |
          printf '### Draft staged; publication requires a separate run\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Candidate ref: `%s`\n- Candidate commit: `%s`\n' \
            "$CANDIDATE_REF" "$CANDIDATE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Release ID: `%s`\n- Draft URL: %s\n' \
            "$RELEASE_ID" "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
