name: Native task systemd integration

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  systemd-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install and build the tested tree
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.12.2 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @ghost/extensions build

      - name: Exercise real receipt-bound scopes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI" == true ]]
          [[ "$GITHUB_ACTIONS" == true ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$RUNNER_OS" == Linux ]]
          [[ "$(cat /proc/1/comm)" == systemd ]]
          uid="$(id -u)"
          [[ "$uid" =~ ^[0-9]+$ && "$uid" -gt 0 ]]
          systemd_version="$(systemctl --version | sed -n '1s/^systemd \([0-9][0-9]*\).*/\1/p')"
          [[ "$systemd_version" =~ ^[0-9]+$ && "$systemd_version" -ge 254 ]]
          canonical_home="$(realpath -e -- "$HOME")"
          [[ "$HOME" == "$canonical_home" ]]
          [[ "$(stat -c %u "$HOME")" == "$uid" ]]
          runtime_dir="/run/user/$uid"
          [[ -d "$runtime_dir" ]]
          [[ "$(realpath -e -- "$runtime_dir")" == "$runtime_dir" ]]
          [[ "$(stat -c %u:%a "$runtime_dir")" == "$uid:700" ]]
          bus_path="$runtime_dir/bus"
          [[ -S "$bus_path" ]]
          [[ "$(stat -c %u:%h "$bus_path")" == "$uid:1" ]]
          bus_address="unix:path=$bus_path"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="$bus_address"
          systemctl --user show-environment >/dev/null
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,4}$ ]]
          suffix="$(tr -d - < /proc/sys/kernel/random/uuid)"
          [[ "$suffix" =~ ^[0-9a-f]{32}$ ]]
          controller_unit="ghost-native-task-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${suffix}.service"
          controller_description="ghost-native-task-ci-receipt:v1:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${suffix}"
          controller_load_state="$(systemctl --user show "$controller_unit" --property=LoadState --value 2>/dev/null || true)"
          [[ "$controller_load_state" == not-found ]]
          bun_bin="$(realpath -e -- "$(command -v bun)")"
          [[ "$bun_bin" == /* && -x "$bun_bin" ]]
          test_file="$(realpath -e -- packages/daemon/test/native-task-scope.real-integration.ts)"
          [[ "$test_file" == "$GITHUB_WORKSPACE/"* && -f "$test_file" ]]
          diagnose() {
            systemctl --user --no-pager --full status "$controller_unit" || true
            journalctl --user --no-pager --lines=80 --unit "$controller_unit" || true
          }
          cleanup() {
            status=$?
            cleanup_status=0
            load_state="$(systemctl --user show "$controller_unit" --property=LoadState --value 2>/dev/null || true)"
            if [[ "$load_state" != not-found ]]; then
              initial_receipt="$(systemctl --user show "$controller_unit" --property=Description --value)" || cleanup_status=1
              if [[ "$initial_receipt" == "$controller_description" ]]; then
                systemctl --user stop "$controller_unit" || cleanup_status=1
                load_state="$(systemctl --user show "$controller_unit" --property=LoadState --value 2>/dev/null || true)"
                if [[ "$load_state" != not-found ]]; then
                  remaining_receipt="$(systemctl --user show "$controller_unit" --property=Description --value)" || cleanup_status=1
                  if [[ "$remaining_receipt" == "$controller_description" ]]; then
                    systemctl --user reset-failed "$controller_unit" || cleanup_status=1
                  else
                    cleanup_status=1
                  fi
                fi
                for _ in $(seq 1 100); do
                  load_state="$(systemctl --user show "$controller_unit" --property=LoadState --value 2>/dev/null || true)"
                  [[ "$load_state" == not-found ]] && break
                  sleep 0.1
                done
                [[ "$load_state" == not-found ]] || cleanup_status=1
              else
                cleanup_status=1
              fi
            fi
            if (( status != 0 || cleanup_status != 0 )); then diagnose; fi
            if (( status != 0 )); then exit "$status"; fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT
          /usr/bin/systemd-run --user \
            "--unit=$controller_unit" \
            "--description=$controller_description" \
            --service-type=exec \
            --slice=session.slice \
            --wait \
            --pipe \
            --collect \
            --quiet \
            -- \
            /usr/bin/env -i \
              HOME="$HOME" \
              PATH=/usr/bin:/bin \
              XDG_RUNTIME_DIR="$runtime_dir" \
              DBUS_SESSION_BUS_ADDRESS="$bus_address" \
              CI="$CI" \
              GITHUB_ACTIONS="$GITHUB_ACTIONS" \
              RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
              RUNNER_OS="$RUNNER_OS" \
              GITHUB_RUN_ID="$GITHUB_RUN_ID" \
              GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              GHOST_NATIVE_TASK_SCOPE_INTEGRATION=1 \
              GHOST_NATIVE_TASK_SCOPE_INTEGRATION_UID="$uid" \
              GHOST_NATIVE_TASK_SCOPE_CONTROLLER_UNIT="$controller_unit" \
              GHOST_NATIVE_TASK_SCOPE_CONTROLLER_DESCRIPTION="$controller_description" \
              "$bun_bin" --bun "$test_file"
