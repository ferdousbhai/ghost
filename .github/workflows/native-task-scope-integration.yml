name: Native task systemd integration

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  systemd-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install and build the tested tree
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.12.2 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @ghost/extensions build

      - name: Start a dedicated ephemeral user manager
        id: manager
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(cat /proc/1/comm)" == systemd ]]
          systemd_version="$(systemctl --version | sed -n '1s/^systemd \([0-9][0-9]*\).*/\1/p')"
          [[ "$systemd_version" =~ ^[0-9]+$ && "$systemd_version" -ge 254 ]]
          test_user=ghost-scope-ci
          test_uid=23456
          runtime_unit="user-runtime-dir@$test_uid.service"
          manager_unit="user@$test_uid.service"
          override_dir="/run/systemd/system/$manager_unit.d"
          override_file="$override_dir/ghost-ci-environment.conf"
          generator_dir="/run/ghost-task-ci-$test_uid-environment-generators"
          diagnose_manager_failure() {
            sudo systemctl --no-pager --full status "$runtime_unit" "$manager_unit" || true
            sudo systemctl --no-pager show \
              --property=LoadState \
              --property=ActiveState \
              --property=SubState \
              --property=Result \
              "$runtime_unit" "$manager_unit" || true
            sudo journalctl --no-pager --lines=80 \
              --unit "$runtime_unit" \
              --unit "$manager_unit" || true
          }
          trap 'status=$?; if (( status != 0 )); then diagnose_manager_failure; fi; exit "$status"' EXIT
          printf 'test_user=%s\n' "$test_user" >> "$GITHUB_OUTPUT"
          printf 'test_uid=%s\n' "$test_uid" >> "$GITHUB_OUTPUT"
          printf 'owner_uid=%s\n' "$(id -u)" >> "$GITHUB_OUTPUT"
          printf 'bun=%s\n' "$(command -v bun)" >> "$GITHUB_OUTPUT"
          ! getent passwd "$test_user" >/dev/null
          ! getent passwd "$test_uid" >/dev/null
          [[ "$test_uid" != "$(id -u)" && "$test_uid" -gt 0 ]]
          sudo useradd --uid "$test_uid" --user-group --create-home --shell /bin/bash "$test_user"
          [[ "$(id -u "$test_user")" == "$test_uid" ]]
          sudo install -d -m700 -o "$test_uid" -g "$test_uid" "/home/$test_user/tmp"
          [[ "$override_file" == "/run/systemd/system/user@23456.service.d/ghost-ci-environment.conf" ]]
          [[ "$generator_dir" == "/run/ghost-task-ci-23456-environment-generators" ]]
          sudo install -d -m755 -- "$override_dir"
          sudo install -d -m755 -- "$generator_dir"
          printf '%s\n' \
            '[Service]' \
            'PAMName=' \
            "Environment=HOME=/home/$test_user" \
            "Environment=USER=$test_user" \
            "Environment=LOGNAME=$test_user" \
            "Environment=XDG_RUNTIME_DIR=/run/user/$test_uid" \
            "Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$test_uid/bus" \
            "Environment=SYSTEMD_ENVIRONMENT_GENERATOR_PATH=$generator_dir" \
            | sudo tee "$override_file" >/dev/null
          sudo chmod 644 "$override_file"
          sudo systemctl daemon-reload
          sudo systemctl start "$runtime_unit" "$manager_unit"
          sudo systemctl is-active --quiet "$runtime_unit"
          sudo systemctl is-active --quiet "$manager_unit"
          [[ -d "/run/user/$test_uid" ]]
          [[ "$(stat -c %u "/run/user/$test_uid")" == "$test_uid" ]]
          for _ in $(seq 1 300); do
            [[ -S "/run/user/$test_uid/bus" ]] && break
            sleep 0.1
          done
          [[ -S "/run/user/$test_uid/bus" ]]
          [[ "$(stat -c %u "/run/user/$test_uid/bus")" == "$test_uid" ]]
          trap - EXIT

      - name: Exercise real receipt-bound scopes
        shell: bash
        env:
          TEST_USER: ${{ steps.manager.outputs.test_user }}
          TEST_UID: ${{ steps.manager.outputs.test_uid }}
          OWNER_UID: ${{ steps.manager.outputs.owner_uid }}
          BUN_BIN: ${{ steps.manager.outputs.bun }}
        run: |
          set -euo pipefail
          [[ "$TEST_USER" == ghost-scope-ci && "$TEST_UID" == 23456 ]]
          exec sudo /usr/sbin/runuser -u "$TEST_USER" -- /usr/bin/env -i \
            HOME="/home/$TEST_USER" \
            PATH=/usr/bin:/bin \
            TMPDIR="/home/$TEST_USER/tmp" \
            XDG_RUNTIME_DIR="/run/user/$TEST_UID" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$TEST_UID/bus" \
            CI=true \
            GITHUB_ACTIONS=true \
            GHOST_NATIVE_TASK_SCOPE_INTEGRATION=1 \
            GHOST_NATIVE_TASK_SCOPE_INTEGRATION_UID="$TEST_UID" \
            GHOST_NATIVE_TASK_SCOPE_OWNER_UID="$OWNER_UID" \
            "$BUN_BIN" --bun \
              packages/daemon/test/native-task-scope.real-integration.ts

      - name: Remove the dedicated user manager
        if: always() && steps.manager.outputs.test_user != ''
        shell: bash
        env:
          TEST_USER: ${{ steps.manager.outputs.test_user }}
          TEST_UID: ${{ steps.manager.outputs.test_uid }}
        run: |
          set -euo pipefail
          [[ "$TEST_USER" == ghost-scope-ci && "$TEST_UID" == 23456 ]]
          override_dir="/run/systemd/system/user@$TEST_UID.service.d"
          override_file="$override_dir/ghost-ci-environment.conf"
          generator_dir="/run/ghost-task-ci-$TEST_UID-environment-generators"
          [[ "$override_file" == "/run/systemd/system/user@23456.service.d/ghost-ci-environment.conf" ]]
          [[ "$generator_dir" == "/run/ghost-task-ci-23456-environment-generators" ]]
          if getent passwd "$TEST_USER" >/dev/null; then
            sudo loginctl disable-linger "$TEST_USER" || true
            sudo systemctl stop "user@$TEST_UID.service" || true
            sudo systemctl stop "user-runtime-dir@$TEST_UID.service" || true
            sudo unlink -- "$override_file" || true
            sudo rmdir -- "$override_dir" || true
            sudo rmdir -- "$generator_dir" || true
            sudo systemctl daemon-reload
            sudo userdel --remove "$TEST_USER"
          fi
