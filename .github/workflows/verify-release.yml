name: Verify published release
# verify-published.sh on GitHub's runners, which have Docker: the public
# one-liner must install this release in a clean Arch container, and the
# previous release must upgrade to it. publish.sh waits for this run and
# rolls the release back if it fails.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (e.g. v0.6.1)
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Install and upgrade through the public one-liner
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          # An install that trusts only the previous release's key can't take
          # a release signed with another one; that upgrade needs the
          # installer run again, so it isn't checked.
          key=packaging/release/package-signing-key.fingerprint
          if [[ -n "$previous" ]] && [[ "$(git show "$previous:$key" 2>/dev/null)" != "$(cat "$key")" ]]; then
            echo "::notice::$previous was signed with another key; checking the fresh install only"
            previous=''
          fi
          bash packaging/release/verify-published.sh "${TAG#v}" "${previous#v}"
