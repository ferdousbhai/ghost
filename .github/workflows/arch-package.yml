name: Arch package

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  # The extension release this Ghost agrees with on the relay protocol. The
  # daemon's conformance test reads this checkout; bump it with the extension.
  RELAY_EXTENSION_REF: v0.5.0

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Update package database and install checkout dependency
        run: pacman -Syu --needed --noconfirm git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ferdousbhai/ghost-chromium-extension
          ref: ${{ env.RELAY_EXTENSION_REF }}
          path: .relay-extension

      - name: Install declared package dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/arch/test-ci-dependencies.sh
          work="$(mktemp -d /tmp/ghost-ci-dependencies.XXXXXX)"
          cleanup() {
            find -P "$work" -depth -delete
          }
          trap cleanup EXIT
          bash packaging/arch/ci-dependencies.sh --names > "$work/names"
          bash packaging/arch/ci-dependencies.sh --constraints > "$work/constraints"
          mapfile -t packages < "$work/names"
          mapfile -t constraints < "$work/constraints"
          [[ "${#packages[@]}" -gt 0 && "${#constraints[@]}" -gt 0 ]]
          pacman -S --needed --noconfirm -- "${packages[@]}"
          pacman -T -- "${constraints[@]}"

      - name: Lint and type-check desktop helper
        working-directory: packages/desktop-helper
        shell: bash
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen mypy

      # makepkg refuses to run as root.
      - name: Create unprivileged package builder
        shell: bash
        run: |
          /usr/bin/useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Build and smoke-test the package
        shell: bash
        run: |
          exec /usr/bin/runuser -u builder -- /usr/bin/env -i \
            HOME=/home/builder PATH=/usr/bin TMPDIR=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_SHA="$GITHUB_SHA" \
            GHOST_CHROMIUM_EXTENSION_DIR="$GITHUB_WORKSPACE/.relay-extension/extension" \
            /usr/bin/bash \
              "$GITHUB_WORKSPACE/packaging/arch/ci-build-development.sh"
