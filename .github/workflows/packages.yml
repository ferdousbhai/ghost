name: Native packages
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Arch Linux ARM ships no bun package, so the aarch64 build installs this
  # upstream release (the version Arch's extra carries for x86_64).
  ARM_BUN_VERSION: 1.4.2
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The daemon's relay conformance test reads a sibling clone of the
      # extension (CONTRACTS.md) and skips without one.
      - uses: actions/checkout@v4
        with:
          repository: ferdousbhai/ghost-chromium-extension
          path: .ci/ghost-chromium-extension
      - uses: actions/cache@v4
        with:
          path: .cache/native/${{ matrix.arch }}
          key: native-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            native-${{ matrix.arch }}-
      - name: Install Arch chroot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts zstd
      - name: Prepare upstream Bun for ARM
        if: matrix.arch == 'aarch64'
        run: |
          base=https://github.com/oven-sh/bun/releases/download/bun-v$ARM_BUN_VERSION
          curl --fail --location --retry 3 "$base/bun-linux-aarch64.zip" -o /tmp/bun-linux-aarch64.zip
          curl --fail --location --retry 3 "$base/SHASUMS256.txt" -o /tmp/bun-SHASUMS256.txt
          (cd /tmp && grep ' bun-linux-aarch64.zip$' bun-SHASUMS256.txt | sha256sum -c -)
          mkdir -p .ci/bun
          unzip -j /tmp/bun-linux-aarch64.zip bun-linux-aarch64/bun -d .ci/bun
      - name: Build, check and smoke-test the package
        run: sudo packaging/arch/arch-run.sh packaging/arch/build-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-${{ matrix.arch }}
          path: |
            dist/*.pkg.tar.zst
            dist/source-commit.txt
          if-no-files-found: error
