name: Native packages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cache/native/${{ matrix.arch }}
          key: native-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            native-${{ matrix.arch }}-
      - name: Install Arch chroot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts zstd
      - name: Lint, then build and test the package
        run: sudo packaging/arch/arch-run.sh packaging/arch/build-native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ghost-${{ matrix.arch }}
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
