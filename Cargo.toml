# Ghost: the daemon with its `ghost` command line, and the window.
[workspace]
resolver = "3"
members = ["packages/daemon", "packages/window"]

[workspace.package]
# The release version, in this one place: both crates inherit it, and
# `ghostd --version`, `ghost --version` and `ghost-window --version` print it.
version = "0.12.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ferdousbhai/ghost"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
