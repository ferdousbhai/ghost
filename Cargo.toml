# Ghost: the daemon with its `ghost` command line, and the bar.
[workspace]
resolver = "3"
members = ["packages/daemon", "packages/bar"]

[workspace.package]
# The release version, in this one place: both crates inherit it, and
# `ghostd --version`, `ghost --version` and `ghost-bar --version` print it.
version = "0.13.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ferdousbhai/ghost"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
